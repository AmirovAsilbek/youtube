<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117; /* GitHub ning qora foni */
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- GitHub saytini to'g'ridan-to'g'ri ichkarida ochish -->
    <iframe src="youtbe.com" allowfullscreen></iframe>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Telegram ekranini to'liq yoyish
    </script>
</body>
</html>
