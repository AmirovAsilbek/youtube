<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .logo {
            color: #ff0000;
            font-weight: bold;
            font-size: 20px;
        }
        input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #121212;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
        }
        .player-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .hint {
            color: #aaa;
            font-size: 14px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">▶ YouTube Mini</div>
    </div>

    <!-- YouTube havolasini kiritish joyi -->
    <input type="text" id="urlInput" placeholder="YouTube video havolasini yuboring..." oninput="playVideo()">

    <!-- Pleyer -->
    <div class="player-box">
        <iframe id="youtubePlayer" src="https://www.youtube.com/embed/kJQP7kiw5Fk" allowfullscreen></iframe>
    </div>

    <div class="hint">
        Istalgan YouTube videosining havolasini yuqoriga tashlasangiz, avtomatik ochiladi!
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function playVideo() {
            const val = document.getElementById('urlInput').value.trim();
            let videoId = '';

            if (val.includes('v=')) {
                videoId = val.split('v=')[1].split('&')[0];
            } else if (val.includes('youtu.be/')) {
                videoId = val.split('youtu.be/')[1].split('?')[0];
            }

            if (videoId.length === 11) {
                document.getElementById('youtubePlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            }
        }
    </script>
</body>
</html>
