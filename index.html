<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Mobile App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; }
        body { background-color: #0f0f0f; color: #fff; padding-bottom: 30px; }

        /* YouTube Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
        }
        .logo span {
            background: #ff0000;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Qidiruv qismi */
        .search-container {
            display: flex;
            padding: 0 16px 12px 16px;
            gap: 8px;
        }
        .search-container input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid #303030;
            background: #121212;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-container input:focus {
            border-color: #3ea6ff;
        }
        .search-container button {
            padding: 0 16px;
            border-radius: 20px;
            border: none;
            background: #272727;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        /* Pleyer qismi */
        .player-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            position: sticky;
            top: 56px;
            z-index: 90;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Video ro'yxati */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px 16px;
        }
        .video-card {
            display: flex;
            gap: 12px;
            cursor: pointer;
        }
        .thumbnail-box {
            position: relative;
            width: 140px;
            height: 80px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #222;
        }
        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .video-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
            color: #f1f1f1;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-channel {
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- Yuqori qism -->
    <div class="header">
        <div class="logo"><span>▶</span> YouTube</div>
    </div>

    <!-- Qidiruv paneli -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Qidirish..." onkeypress="handleEnter(event)">
        <button onclick="searchVideos()">🔍</button>
    </div>

    <!-- Video Pleyer -->
    <div class="player-box">
        <iframe id="mainPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" allowfullscreen></iframe>
    </div>

    <!-- Videolar ro'yxati -->
    <div class="video-list" id="videoList">
        <!-- Bu yerga videolar avtomatik chiqadi -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Boshlang'ich tavsiya etilgan videolar bazasi (ID, Nomi, Kanal)
        const defaultVideos = [
            { id: "dQw4w9WgXcQ", title: "Never Gonna Give You Up", channel: "Rick Astley" },
            { id: "kJQP7kiw5Fk", title: "Despacito ft. Daddy Yankee", channel: "Luis Fonsi" },
            { id: "L_LUpnjgPso", title: "Relaxing Lofi Hip Hop Radio - Beats to Study/Relax", channel: "Lofi Girl" },
            { id: "jfKfPfyJRdk", title: "Lofi Hip Hop Radio - Live 24/7 chill beats", channel: "Lofi Girl" },
            { id: "9bZkp7q19f0", title: "PSY - GANGNAM STYLE(강남스타일) M/V", channel: "officialpsy" }
        ];

        // Sahifa ochilganda videolarni chiqarish
        window.onload = function() {
            displayVideos(defaultVideos);
        };

        function displayVideos(videos) {
            const listEl = document.getElementById('videoList');
            listEl.innerHTML = '';

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => playVideo(video.id);

                card.innerHTML = `
                    <div class="thumbnail-box">
                        <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="thumb">
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-channel">${video.channel}</div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // Videoni pleyerda ochish
        function playVideo(id) {
            document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Qidiruv tugmasi bosilganda yoki Enter bosilganda
        function handleEnter(e) {
            if (e.key === 'Enter') {
                searchVideos();
            }
        }

        function searchVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                displayVideos(defaultVideos);
                return;
            }

            // Qidiruv so'ziga mos keluvchi videolarni filtrlash
            const filtered = defaultVideos.filter(v => 
                v.title.toLowerCase().includes(query) || v.channel.toLowerCase().includes(query)
            );

            if (filtered.length > 0) {
                displayVideos(filtered);
            } else {
                // Agar bazada topilmasa, YouTube qidiruv sahifasiga yo'naltirish yoki xabar berish
                document.getElementById('videoList').innerHTML = `<p style="color:#aaa; text-align:center; padding:20px;">Hech narsa topilmadi. Boshqa so'z yozib ko'ring.</p>`;
            }
        }
    </script>
</body>
</html>
