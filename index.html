<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f0f0f; color: #fff; padding-bottom: 20px; }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { color: #ff0000; font-size: 20px; font-weight: bold; }
        .logo-text { color: #fff; font-size: 18px; font-weight: bold; }

        .search-box {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px 16px;
        }
        input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid #303030;
            background: #121212;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #3ea6ff; }
        button {
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            background: #cc0000;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            position: sticky;
            top: 50px;
            z-index: 90;
        }
        iframe { width: 100%; height: 100%; border: none; }

        .video-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px 16px;
        }
        .video-card {
            display: flex;
            gap: 12px;
            background: #181818;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }
        .video-card img {
            width: 120px;
            height: 68px;
            border-radius: 6px;
            object-fit: cover;
        }
        .video-info { display: flex; flex-direction: column; justify-content: center; }
        .video-title { font-size: 13px; font-weight: 500; line-height: 1.3; color: #fff; margin-bottom: 4px; }
        .video-channel { font-size: 11px; color: #aaa; }
    </style>
</head>
<body>

    <div class="header">
        <span class="logo">▶</span>
        <span class="logo-text">YouTube</span>
    </div>

    <!-- Qidiruv paneli -->
    <div class="search-box">
        <input type="text" id="queryInput" placeholder="Videolarni qidirish yoki havola kiriting..." onkeypress="if(event.key==='Enter') performSearch()">
        <button onclick="performSearch()">Qidirish</button>
    </div>

    <!-- Pleyer -->
    <div class="player-container">
        <iframe id="mainPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" allowfullscreen></iframe>
    </div>

    <!-- Videolar Ro'yxati -->
    <div class="video-list" id="results">
        <!-- Qidiruv natijalari shu yerga chiqadi -->
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Qidiruv funksiyasi (Invidious va YouTube ochiq API orqali)
        async function performSearch() {
            const input = document.getElementById('queryInput').value.trim();
            if (!input) return;

            // Agar to'g'ridan-to'g'ri YouTube havolasi tashlangan bo'lsa
            if (input.includes('v=') || input.includes('youtu.be/')) {
                let videoId = '';
                if (input.includes('v=')) {
                    videoId = input.split('v=')[1].split('&')[0];
                } else if (input.includes('youtu.be/')) {
                    videoId = input.split('youtu.be/')[1].split('?')[0];
                }
                if (videoId) {
                    playVideo(videoId);
                    return;
                }
            }

            // So'z bo'yicha YouTube'dan videolar qidirish (API orqali)
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '<p style="color:#aaa; text-align:center;">Qidirilmoqda...</p>';

            try {
                const response = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(input)}&filter=videos`);
                const data = await response.json();

                resultsContainer.innerHTML = '';

                if (data.items && data.items.length > 0) {
                    data.items.slice(0, 15).forEach(item => {
                        const videoId = item.url.split('v=')[1];
                        const card = document.createElement('div');
                        card.className = 'video-card';
                        card.onclick = () => playVideo(videoId);

                        card.innerHTML = `
                            <img src="${item.thumbnail}" alt="thumb">
                            <div class="video-info">
                                <div class="video-title">${item.title}</div>
                                <div class="video-channel">${item.uploaderName || 'YouTube Video'}</div>
                            </div>
                        `;
                        resultsContainer.appendChild(card);
                    });
                } else {
                    resultsContainer.innerHTML = '<p style="color:#aaa; text-align:center;">Hech narsa topilmadi.</p>';
                }
            } catch (err) {
                resultsContainer.innerHTML = '<p style="color:#aaa; text-align:center;">Qidiruvda xatolik bo\'ldi. Iltimos, qayta urinib ko\'ring.</p>';
            }
        }

        function playVideo(id) {
            document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
